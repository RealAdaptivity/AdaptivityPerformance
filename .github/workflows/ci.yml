# Validates a pull request before it can reach main.
#
# deploy.yml only runs on pushes to main, which means it validates changes that
# are already live. This runs the same checks while they are still reviewable.
name: CI

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it fails on a package-lock.json that
      # has drifted from package.json, which is what the deploy would hit.
      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify production operations
        run: npm run verify:production-ops

      # Runs generate-sitemap, verify-local-seo, tsc -b, vite build and
      # emit-static-routes. The last one fails if any sitemap URL would have no
      # static file and therefore be served as an HTTP 404 by GitHub Pages.
      #
      # No secrets: the build does not need them, and leaving them out keeps
      # this green for pull requests from forks.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: '/'
