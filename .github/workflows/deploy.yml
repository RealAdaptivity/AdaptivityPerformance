name: Deploy Adaptivity Performance to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify production operations
        run: npm run verify:production-ops

      - name: Build Vite Website
        run: npm run build
        env:
          # Absolute base required for deep routes (/portal, /login, /admin) on the custom domain.
          # Relative './' resolves assets under /portal/assets and whitescreens the login page.
          VITE_BASE_PATH: '/'
          VITE_SUPABASE_URL: 'https://qqyairzymqpkbfxobztx.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxeWFpcnp5bXFwa2JmeG9ienR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTExNTUsImV4cCI6MjEwMDU4NzE1NX0.a6pkHT6fVnW6synzig51QOmR0x48fi88zi6RT7MpeLs'
          # Repo Settings → Secrets → Actions: VITE_STRIPE_PUBLISHABLE_KEY=pk_live_...
          # Retained so any not-yet-migrated Stripe surface keeps building.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # PayPal. config/paypalEnvironment.ts throws when the client id for the
          # active mode is missing, which would break booking on the live site —
          # so these must exist as repo secrets before this branch reaches main.
          # Set VITE_PAYPAL_MODE to 'sandbox' until a real booking has been
          # tested end to end.
          VITE_PAYPAL_MODE: ${{ secrets.VITE_PAYPAL_MODE }}
          VITE_PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.VITE_PAYPAL_SANDBOX_CLIENT_ID }}
          VITE_PAYPAL_LIVE_CLIENT_ID: ${{ secrets.VITE_PAYPAL_LIVE_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
