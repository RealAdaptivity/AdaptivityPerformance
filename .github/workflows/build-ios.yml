name: Build Mechanic iOS App Artifact

# Produces the Capacitor 8 SPM Xcode project as a downloadable artifact.
# Prefer the TestFlight workflow for signed .ipa upload when secrets are configured.

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Prepare Capacitor iOS Project (SPM)
        run: |
          set -euo pipefail
          node -e "fs.copyFileSync('capacitor.tech.json', 'capacitor.config.json')"
          if [ ! -d ios/App/App.xcodeproj ]; then
            npx --no-install cap add ios
          fi
          npx --no-install cap sync ios
          test -f ios/App/App.xcodeproj/project.pbxproj

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adaptivity-Tech-iOS-Project
          path: ios/
