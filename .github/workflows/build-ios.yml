name: Build Mechanic iOS App in Cloud (Mac Runner)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Prepare Capacitor iOS Project
        run: |
          node -e "fs.copyFileSync('capacitor.tech.json', 'capacitor.config.json')"
          npx cap add ios || true
          npx cap sync ios

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adaptivity-Tech-iOS-Project
          path: ios/
